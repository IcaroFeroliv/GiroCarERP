[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "test_regras.py"]
addopts = "--cov=. --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "venv/*",
    "tests/*",
    "test_regras.py",
    "htmlcov/*",
    ".streamlit/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true